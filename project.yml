name: Cotabby
options:
  bundleIdPrefix: io.ichthyoplanktonzyh.lingrove
  defaultConfig: Release
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  # XcodeGen does not discover languages inside String Catalogs; keep generated metadata in sync.
  postGenCommand: python3 scripts/localization.py sync-regions
  groupSortPosition: top
  xcodeVersion: "2600"
packages:
  MDictReader:
    path: Packages/MDictReader
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1
  CotabbyInference:
    url: https://github.com/FuJacob/cotabbyinference.git
    branch: main
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.12.1
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
# Signing lives in xcconfig files, not the generated project. `Config/Signing.xcconfig` (committed)
# includes the gitignored `Config/Signing.local.xcconfig` that `scripts/dev-setup.sh` writes for
# each developer's own team. It sits in a subdirectory on purpose: a root-level config file makes XcodeGen name a group
# after the checkout directory, which drifts between clones and CI. DEVELOPMENT_TEAM must also stay
# out of the build settings above: project/target settings outrank an xcconfig and would prevent the
# local override from winning.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
# Shared application target body. `Cotabby` (prod) and `Cotabby Dev` both build the same sources
# from this template and differ only in identity-bearing settings below, so the dev build can hold
# its own Accessibility/TCC grant without ever clobbering the released app's.
targetTemplates:
  CotabbyApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Cotabby
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: native/tts/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: native/tts/LLAMA_LICENSE.txt
        buildPhase: resources
      - path: Cotabby/Resources/DictionaryNotices/MDict-LICENSE.txt
        buildPhase: resources
      - path: Cotabby/Resources/DictionaryNotices/MDict-NOTICE.md
        buildPhase: resources
    dependencies:
      - target: LingroveCLI
        embed: false
      - package: MDictReader
        product: MDictReader
      - package: Sparkle
        product: Sparkle
      - package: CotabbyInference
        product: CotabbyInference
      - package: swift-log
        product: InMemoryLogging
      - package: swift-log
        product: Logging
      - package: LaunchAtLogin
        product: LaunchAtLogin
    postBuildScripts:
      - name: Embed command-line client
        script: '"${SRCROOT}/scripts/embed_cli.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/embed_cli.sh
          - $(BUILT_PRODUCTS_DIR)/lingrove
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/lingrove
      - name: Embed system dictionary helper
        script: '"${SRCROOT}/scripts/embed_dictionary_helper.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/embed_dictionary_helper.sh
          - $(SRCROOT)/build/dictionary-native/lingrove-dictionary-helper
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/lingrove-dictionary-helper
      - name: Embed local speech runtime
        script: '"${SRCROOT}/scripts/embed_tts_runtime.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/embed_tts_runtime.sh
          - $(SRCROOT)/build/tts-native/install/bin/lingrove-tts-helper
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/lingrove-tts-helper
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CotabbyInfo.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "0.5.1"
        # Keep source/module and scheme names stable during the identity migration. PRODUCT_NAME
        # owns the installed bundle, executable, and data-folder name; PRODUCT_MODULE_NAME keeps
        # existing `@testable import Cotabby` references valid without a simultaneous source rename.
        PRODUCT_NAME: Lingrove
        PRODUCT_MODULE_NAME: Cotabby
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
targets:
  LingroveCLI:
    type: tool
    platform: macOS
    sources:
      - path: LingroveCLI
      # Reuse the app's source root so XcodeGen shares the same folder hierarchy.
      # Adding a leaf folder as another root gives one PBXGroup two parents.
      - path: Cotabby
        includes:
          - Models/CLI/**
          - Support/CLI/**
    settings:
      base:
        PRODUCT_NAME: lingrove
        PRODUCT_BUNDLE_IDENTIFIER: io.ichthyoplanktonzyh.lingrove.cli
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  Cotabby:
    templates:
      - CotabbyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ichthyoplanktonzyh.lingrove
  # Local development build. Distinct bundle identifier + product name means a separate, stable
  # TCC identity (Accessibility, Input Monitoring, Screen Recording survive rebuilds), the dev app
  # icon makes it visually distinct, and the COTABBY_DEV compilation condition disables Sparkle so
  # the prod appcast never replaces it.
  "Cotabby Dev":
    templates:
      - CotabbyApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        PRODUCT_NAME: Lingrove Dev
        # Overridable so a contributor whose personal team rejects the shared id can set their own
        # LINGROVE_DEV_BUNDLE_ID in Signing.local.xcconfig; a previous Cotabby override must not
        # silently restore the upstream identity for a renamed Lingrove product.
        PRODUCT_BUNDLE_IDENTIFIER: "$(LINGROVE_DEV_BUNDLE_ID:default=io.ichthyoplanktonzyh.lingrove.dev)"
        # Keep this under `base:` so COTABBY_DEV is defined in EVERY configuration, Release included.
        # Do not scope it to `configs: Debug:`. A Release-config dev build (the scheme's Profile and
        # Archive actions) must still compile Sparkle out; otherwise it could pull the prod appcast
        # and replace itself with the released bundle, the exact identity collapse this target exists
        # to prevent.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: COTABBY_DEV $(inherited)
  CotabbyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CotabbyTests
    dependencies:
      - target: Cotabby
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.ichthyoplanktonzyh.lingrove.CotabbyTests
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lingrove.app/Contents/MacOS/Lingrove
schemes:
  Cotabby:
    build:
      targets:
        Cotabby: all
    run:
      config: Debug
      commandLineArguments:
        -cotabby-debug: true
    test:
      config: Debug
      # Existing search/ranking fixtures assert English titles. Resource tests select each locale
      # explicitly; keep these fixtures independent of the contributor's macOS/app preference.
      language: en
      gatherCoverageData: false
      targets:
        - CotabbyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Daily-driver scheme. Builds the dev-identity target so running from Xcode never touches the
  # released app's permissions. No test action here: CotabbyTests is bound to the prod `Cotabby`
  # target (its TEST_HOST points at "Lingrove.app"), so tests continue to run from the Cotabby scheme.
  "Cotabby Dev":
    build:
      targets:
        "Cotabby Dev": all
    run:
      config: Debug
      commandLineArguments:
        -cotabby-debug: true
    # Profile/Archive intentionally stay on Release for representative optimized timings. Versus a
    # prod Release build the only difference is COTABBY_DEV (Sparkle compiled out), which is not on
    # any hot path, so dev profiling stays representative while the artifact is never shippable.
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
